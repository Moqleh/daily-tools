  <noscript><section class="seo-static"><h1>أدواتك اليومية</h1><p>منصة أدوات مجانية وسريعة وبدون تسجيل للحسابات اليومية والتاريخ والوقت وتحويل الوحدات والنصوص والتعليم والصحة العامة والمطبخ والخصوصية.</p><h2>الأدوات المتاحة</h2><ul><li>الحاسبات: حساب العمر والنسبة والخصم وتقسيم الفاتورة وتكلفة الوقود.</li><li>التاريخ والتقويم: تاريخ اليوم وفرق تاريخين وإضافة وطرح الأيام والعد التنازلي.</li><li>الوقت: ساعة رقمية ومؤقت وساعة إيقاف وحساب المدة.</li><li>تحويل الوحدات: الطول والوزن والمساحة والحجم والحرارة والسرعة.</li><li>السيارة والسفر: استهلاك الوقود وتكلفة الرحلة وقائمة السفر.</li><li>المال والادخار: هدف الادخار والفائدة والميزانية والعائد على الاستثمار.</li><li>العقار والسكن: الإيجار وسعر المتر والدفعة الأولى وميزانية السكن.</li><li>الموظف والراتب: الراتب والزيادة والعمل الإضافي والإجازات.</li><li>النصوص: عد الكلمات والحروف وترتيب الأسطر وإزالة التكرار.</li><li>التعليم: المعدل والنسبة والدرجة المطلوبة ومؤقت المذاكرة.</li><li>الصحة العامة: BMI وتحويل الطول والوزن واحتياج الماء وBMR.</li><li>المطبخ: تحويل المقاييس ومضاعفة الوصفة ومؤقت المطبخ.</li><li>QR والخصوصية: إنشاء QR وكلمات المرور وأدوات الحماية.</li></ul><h2>أسئلة شائعة</h2><details open><summary>هل الموقع مجاني؟</summary><p>نعم، الأدوات الأساسية مجانية وبدون تسجيل.</p></details><details open><summary>هل يعمل على الهاتف والكمبيوتر؟</summary><p>نعم، الموقع مصمم للعمل على الأجهزة الحديثة.</p></details><details open><summary>هل النتائج الصحية أو المالية رسمية؟</summary><p>لا، النتائج التقديرية للإرشاد العام ولا تستبدل المختص أو الجهة الرسمية.</p></details></section></noscript>
