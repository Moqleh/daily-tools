<!DOCTYPE html>
<html lang="ar" dir="rtl" style="color-scheme:light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="أدواتك اليومية - أدوات عملية وبسيطة بالعربية والإنجليزية">
  <title>أدواتك اليومية | Daily Tools</title>
  <style>
    html,body,#root{min-height:100%;background:#fff!important;color:#071d49!important;color-scheme:light!important}
    input,textarea,select,button{color-scheme:light!important;touch-action:manipulation}
    button,[role="button"]{-webkit-tap-highlight-color:transparent}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (()=>{
      document.documentElement.style.colorScheme='light';
      document.documentElement.dataset.theme='light';
      const ar=()=>document.documentElement.dir==='rtl';
      const formatNumber=v=>Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
      const formatDate=value=>{
        const d=value instanceof Date?value:new Date(value);
        if(Number.isNaN(d.getTime())) return ar()?'تاريخ غير صالح':'Invalid date';
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
      };
      window.DailyToolsFormat={number:formatNumber,date:formatDate};
    })();
  </script>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
