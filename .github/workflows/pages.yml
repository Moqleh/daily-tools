name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify generated SEO artifact
        run: |
          set -euo pipefail
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -Fq '<urlset' dist/sitemap.xml
          grep -Fq '/daily-tools/tools/' dist/sitemap.xml
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published sitemap
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --output /tmp/sitemap.xml "${SITE_URL%/}/sitemap.xml"
          grep -Fq '/daily-tools/tools/' /tmp/sitemap.xml
